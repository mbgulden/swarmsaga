[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmsaga"
version = "0.1.0"
description = "Distributed Saga & Compensating Transaction Hypervisor for Multi-Agent Swarms"
license = "MIT"
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "michael@growthwebdev.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
swarmsaga = "swarmsaga.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/mbgulden/swarmsaga"
